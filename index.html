<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Million">
<meta name="theme-color" content="#1F5C43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Million a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;600&display=swap">
<style>
/* Layout: one centered column, the counter is the page; a bank-note engraving pattern sits behind it.
   Incoming-money pings stack at the top of the screen like phone notifications. */
:root {
  --bg: #EEF1EC;
  --ink: #14231C;
  --money: #1F5C43;
  --muted: #5E6F66;
  --line: #C9D3CA;
  --panel: #E3E9E2;
  --toast: rgba(250, 252, 250, .94);
  --toast-shadow: 0 10px 30px rgba(20, 35, 28, .16), 0 1px 3px rgba(20, 35, 28, .10);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Libre Franklin", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --ink: #E4ECE6; --money: #82C9A2; --muted: #8B9C92;
    --line: #26332C; --panel: #141E19; --toast: rgba(26, 37, 31, .95);
    --toast-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --ink: #E4ECE6; --money: #82C9A2; --muted: #8B9C92;
  --line: #26332C; --panel: #141E19; --toast: rgba(26, 37, 31, .95);
  --toast-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 15px; line-height: 1.5;
}
#engrave { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap {
  position: relative; z-index: 1; max-width: 760px; margin: 0 auto;
  padding: 28px 16px 40px; min-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 28px;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.label {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}
.date { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 4vh 0; }
.counter {
  font-family: var(--display); font-weight: 800; color: var(--money);
  font-variant-numeric: tabular-nums; line-height: .9; letter-spacing: -.005em;
  font-size: clamp(64px, 17vw, 156px); white-space: nowrap;
}
.counter .cents { font-weight: 500; font-size: .5em; opacity: .75; }
.statement {
  font-size: clamp(17px, 3.6vw, 21px); font-weight: 600; max-width: 34ch;
  text-wrap: balance; margin: 4px 0 0;
}

.received { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.received strong {
  font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--money);
  font-variant-numeric: tabular-nums;
}
.received span.count { color: var(--muted); }
.received strong.bump { animation: bump .6s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 100% { transform: scale(1); } }

.day { display: flex; flex-direction: column; gap: 8px; }
.bar { position: relative; height: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--money); width: 0; }
.ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.1; }

.next { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.next strong { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--money); font-variant-numeric: tabular-nums; }
.next span { color: var(--muted); }

.move { display: flex; flex-direction: column; gap: 6px; }
input[type="text"], input[type="number"] {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; width: 100%; box-sizing: border-box;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--money); outline-offset: 2px; }

details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " +"; }
details[open] summary::after { content: " –"; }
.settings { display: grid; gap: 14px; margin-top: 14px; }
.settings label { display: flex; flex-direction: column; gap: 6px; }
.settings label.check { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; }
.settings input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--money); margin: 0; }

button.full {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
  background: transparent; color: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; padding: 7px 12px; cursor: pointer;
}
button.full:hover { border-color: var(--money); color: var(--money); }

/* Incoming-money notifications */
.pings {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.ping {
  pointer-events: auto; width: 100%; max-width: 420px; box-sizing: border-box;
  display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start;
  background: var(--toast); color: var(--ink);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 18px; padding: 11px 13px;
  box-shadow: var(--toast-shadow); cursor: pointer;
  animation: drop .45s cubic-bezier(.2, .9, .3, 1.15) both;
}
.ping.out { animation: rise .35s ease-in forwards; }
@keyframes drop { from { transform: translateY(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { to { transform: translateY(-120%); opacity: 0; } }
.ping .icon {
  width: 38px; height: 38px; border-radius: 9px; background: var(--money); color: var(--bg);
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px;
}
.ping .body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ping .head { display: flex; justify-content: space-between; gap: 8px; }
.ping .app { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.ping .when { font-size: 12px; color: var(--muted); }
.ping .title { font-weight: 600; font-size: 19px; line-height: 1.25; }
.ping .title b { color: var(--money); font-variant-numeric: tabular-nums; }
.ping .memo { font-size: 13.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  .ping, .ping.out, .received strong.bump { animation-duration: .01ms; }
}
@media (max-width: 460px) {
  .stat b { font-size: 21px; }
  .stat { padding: 12px 8px; }
}
</style>

<canvas id="engrave" aria-hidden="true"></canvas>
<div class="pings" id="pings" aria-live="polite"></div>

<main class="wrap">
  <div class="top">
    <span class="label">Today's count · resets at midnight</span>
    <button class="full" id="fullBtn" type="button">Focus mode</button>
  </div>

  <section class="hero" aria-live="off">
    <div class="date" id="date"></div>
    <div class="counter" id="counter">$0<span class="cents">.00</span></div>
    <p class="statement" id="statementOut"></p>
  </section>

  <div class="received">
    <span class="label">Received today</span>
    <strong id="recvAmt">$0</strong>
    <span class="count" id="recvCount"></span>
  </div>

  <section class="day" aria-label="How much of today has passed">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="ticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
  </section>

  <section class="stats">
    <div class="stat"><span class="label">Per second</span><b id="perSec"></b></div>
    <div class="stat"><span class="label">Per minute</span><b id="perMin"></b></div>
    <div class="stat"><span class="label">Per hour</span><b id="perHr"></b></div>
  </section>

  <div class="next">
    <span class="label">Next mark</span>
    <strong id="nextAmt"></strong>
    <span id="nextTime"></span>
  </div>

  <label class="move">
    <span class="label">Today's one move toward it</span>
    <input type="text" id="move" placeholder="e.g. Ship the Eleven practice-plan screen" maxlength="120">
  </label>

  <details>
    <summary class="label">Settings</summary>
    <div class="settings">
      <label><span class="label">Daily target ($)</span>
        <input type="number" id="goal" min="1" step="1000" inputmode="numeric"></label>
      <label><span class="label">Your statement</span>
        <input type="text" id="statement" maxlength="90"></label>
      <label class="check"><input type="checkbox" id="pingsOn"><span>Money pings</span></label>
      <label class="check"><input type="checkbox" id="soundOn"><span>Ping sound (starts after your first tap)</span></label>
    </div>
  </details>
</main>

<script>
(function () {
  const DAY = 86400;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);

  let goal = Number(store.get("mad.goal", 1000000)) || 1000000;
  let statement = store.get("mad.statement", "I build systems that earn while I sleep.");
  let pingsOn = store.get("mad.pings", "1") === "1";
  let soundOn = store.get("mad.sound", "1") === "1";

  const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const timeFmt = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" });
  const dateFmt = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric" });

  $("goal").value = goal;
  $("statement").value = statement;
  $("pingsOn").checked = pingsOn;
  $("soundOn").checked = soundOn;
  $("move").value = store.get("mad.move." + new Date().toDateString(), "");

  function renderStatic() {
    $("statementOut").textContent = statement;
    $("perSec").textContent = usd2.format(goal / DAY);
    $("perMin").textContent = usd0.format(goal / 1440);
    $("perHr").textContent = usd0.format(goal / 24);
  }
  renderStatic();

  $("goal").addEventListener("input", e => {
    const v = Number(e.target.value);
    if (v > 0) { goal = v; store.set("mad.goal", String(v)); renderStatic(); }
  });
  $("statement").addEventListener("input", e => {
    statement = e.target.value; store.set("mad.statement", statement); renderStatic();
  });
  $("move").addEventListener("input", e => store.set("mad.move." + new Date().toDateString(), e.target.value));
  $("pingsOn").addEventListener("change", e => {
    pingsOn = e.target.checked; store.set("mad.pings", pingsOn ? "1" : "0");
    if (pingsOn) schedule(1500);
  });
  $("soundOn").addEventListener("change", e => { soundOn = e.target.checked; store.set("mad.sound", soundOn ? "1" : "0"); });

  // ---------- Money pings ----------
  const senders = [
    "Halcyon Partners", "Northline Capital", "Eleven", "Brightwater Holdings", "Summit Ridge Group",
    "Meridian Ventures", "Copperleaf Media", "Atlas & Pine", "Bluefield Labs", "Granite Peak Fund",
    "Silver Creek Licensing", "Oakmont Royalties", "Tidewater Co.", "Keystone Digital", "Evergreen Trust"
  ];
  const memos = [
    "Annual license — thank you!", "Royalty payout", "Investment return", "Distribution for Q4",
    "Licensing deal, first installment", "Partnership payment", "Bonus. Well earned.",
    "Subscription revenue", "Paid in full", "Dividend", "For the deal we closed", "Consulting retainer",
    "Revenue share", "Acquisition earnest money", "Sponsorship", "Wire transfer received"
  ];
  const kinds = ["Deposit", "Wire received", "Payment received", "Transfer in"];
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function amount() {
    // log-uniform between 0.2% and 8% of the daily target, with an occasional big one
    let lo = goal * 0.002, hi = goal * 0.08;
    if (Math.random() < 0.1) { lo = goal * 0.12; hi = goal * 0.3; }
    const v = Math.exp(Math.log(lo) + Math.random() * (Math.log(hi) - Math.log(lo)));
    return Math.random() < 0.5 ? Math.round(v / 100) * 100 : Math.round(v * 100) / 100;
  }

  const todayKey = () => "mad.recv." + new Date().toDateString();
  function loadRecv() {
    try { return JSON.parse(store.get(todayKey(), "")) || { total: 0, n: 0 }; } catch (e) { return { total: 0, n: 0 }; }
  }
  let recv = loadRecv();
  function renderRecv(bump) {
    $("recvAmt").textContent = usd0.format(recv.total);
    $("recvCount").textContent = recv.n ? "from " + recv.n + (recv.n === 1 ? " payment" : " payments") : "the first ping is on its way";
    if (bump) { const el = $("recvAmt"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  }
  renderRecv(false);

  // Soft two-note chime; browsers only allow sound after the first tap
  let audio = null;
  function unlock() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  document.addEventListener("pointerdown", unlock, { once: true });
  document.addEventListener("keydown", unlock, { once: true });
  function chime() {
    if (!soundOn || !audio) return;
    try {
      const t = audio.currentTime;
      [[1318.5, 0], [1760, 0.09]].forEach(([f, d]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.5);
        o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + 0.55);
      });
    } catch (e) {}
  }

  function dismiss(el) {
    if (!el.isConnected || el.classList.contains("out")) return;
    el.classList.add("out");
    setTimeout(() => el.remove(), 380);
  }

  function ping() {
    const amt = amount();
    const el = document.createElement("div");
    el.className = "ping";
    el.innerHTML =
      '<div class="icon" aria-hidden="true">$</div>' +
      '<div class="body">' +
        '<div class="head"><span class="app"></span><span class="when">now</span></div>' +
        '<div class="title"><b></b></div>' +
        '<div class="memo">Deposited to your account</div>' +
      '</div>';
    el.querySelector(".app").textContent = pick(kinds).toUpperCase();
    el.querySelector("b").textContent = "+" + usd2.format(amt);
    el.addEventListener("click", () => dismiss(el));

    const box = $("pings");
    box.prepend(el);
    while (box.children.length > 3) box.lastElementChild.remove();
    setTimeout(() => dismiss(el), 7000);

    if (todayKey() !== recv.key) { recv = loadRecv(); recv.key = todayKey(); }
    recv.total += amt; recv.n += 1;
    store.set(todayKey(), JSON.stringify({ total: recv.total, n: recv.n }));
    renderRecv(true);
    chime();
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
  }
  recv.key = todayKey();

  let timer = null;
  function schedule(delay) {
    clearTimeout(timer);
    if (!pingsOn) return;
    timer = setTimeout(() => {
      if (pingsOn && !document.hidden) ping();
      schedule(15000); // every 15 seconds
    }, delay);
  }
  // A burst when you open the page, then a steady flow
  function openingBurst() {
    if (!pingsOn) return;
    setTimeout(() => { if (pingsOn) ping(); }, 1200);
    schedule(16200);
  }
  openingBurst();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) openingBurst(); else clearTimeout(timer);
  });

  // ---------- Daily counter ----------
  let lastDay = new Date().toDateString();

  function tick() {
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const secs = (now - midnight) / 1000;
    const frac = Math.min(secs / DAY, 1);
    const value = goal * frac;

    const s = usd2.format(value);
    const dot = s.lastIndexOf(".");
    $("counter").innerHTML = s.slice(0, dot) + '<span class="cents">' + s.slice(dot) + "</span>";
    $("fill").style.width = (frac * 100).toFixed(3) + "%";

    const step = goal / 10;
    const nextVal = Math.min(goal, Math.floor(value / step + 1) * step);
    const atSecs = (nextVal / goal) * DAY;
    const at = new Date(midnight.getTime() + atSecs * 1000);
    $("nextAmt").textContent = usd0.format(nextVal);
    $("nextTime").textContent = nextVal >= goal ? "at midnight, then it starts over" : "at " + timeFmt.format(at);

    if (now.toDateString() !== lastDay) {   // new day: clear yesterday's move and received total
      lastDay = now.toDateString();
      $("move").value = store.get("mad.move." + lastDay, "");
      recv = loadRecv(); recv.key = todayKey(); renderRecv(false);
    }
    $("date").textContent = dateFmt.format(now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Focus mode: fullscreen + keep the screen awake where the device allows it
  let lock = null;
  $("fullBtn").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) await document.exitFullscreen();
    } catch (e) {}
    try { if (!lock && navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch (e) {}
  });

  // Engraved background: concentric guilloche rosette, drawn once per resize
  const cv = $("engrave"), ctx = cv.getContext("2d");
  function engrave() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
    ctx.lineWidth = 0.6;
    ctx.globalAlpha = 0.55;
    const cx = w * 0.82, cy = h * 0.22, R = Math.max(w, h) * 0.55;
    for (let k = 0; k < 14; k++) {
      const base = R * (0.25 + k * 0.055);
      ctx.beginPath();
      for (let t = 0; t <= Math.PI * 2 + 0.01; t += 0.01) {
        const r = base + Math.sin(t * 24 + k * 0.6) * 7 + Math.sin(t * 7) * 4;
        const x = cx + r * Math.cos(t), y = cy + r * Math.sin(t);
        t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  engrave();
  window.addEventListener("resize", engrave);
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", engrave); } catch (e) {}
  new MutationObserver(engrave).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>

</body></html>
